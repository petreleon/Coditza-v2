name: coditza

services:
  api:
    build:
      context: .
      target: development
    env_file:
      - "${CODITZA_ENV_FILE:-.env}"
    environment:
      HOST: 0.0.0.0
      PORT: "${PORT:-3000}"
    init: true
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    stop_grace_period: 70s
    volumes:
      - type: bind
        source: ./apps/api/src
        target: /workspace/apps/api/src
        read_only: true

  checks:
    profiles: ["checks"]
    build:
      context: .
      target: checks
    command: ["npm", "run", "format:check"]
    entrypoint: []
    init: true
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      npm_config_cache: /tmp/npm-cache
      npm_config_update_notifier: "false"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,uid=1000,gid=1000,size=64m
      - /workspace/apps/api/dist:rw,noexec,nosuid,nodev,mode=0755,uid=1000,gid=1000,size=64m
